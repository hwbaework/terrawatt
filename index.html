<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 브이월드 3D 로더가 자기 스크립트를 http:// 로 부르는데(document.write),
         배포는 https:// 라 브라우저가 "혼합 콘텐츠"로 전부 차단해 3D 엔진(vw)이 안 뜬다.
         이 지시로 http 하위요청을 https 로 자동 승격시켜 차단을 푼다.
         (map.vworld.kr 은 https 로도 같은 스크립트를 제공함 — 확인함) -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230f172a%22/><path d=%22M56 12 L27 57 L45 57 L40 88 L73 42 L52 42 Z%22 fill=%22%23f59e0b%22/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TerraWatt — 태양 위치·날씨·전력망을 실시간으로 담은 인터랙티브 3D 에너지 지도" />
    <meta property="og:title" content="TerraWatt · 3D Energy Grid Explorer" />
    <meta property="og:description" content="Mapbox GL JS 기반 3D 에너지 지도 — 태양 고도 시뮬레이션, 날씨 효과, 송배전망 시각화" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>TerraWatt · 3D Energy Grid Explorer</title>

    <!--
      브이월드 웹지엘 3D지도 API 3.0 로더.

      ⚠️ **여기(HTML)에 정적으로 있어야만 동작한다.** 리액트에서 나중에 끼워넣으면
         로더는 실행되지만 vw 객체가 끝내 안 생긴다(로더 내부가 옛날 document.write 방식).
         그래서 v0.3의 3D 화면은 이 태그에 의존한다.

      키·도메인은 Vite가 .env 값으로 치환한다:
        VITE_VWORLD_KEY / VITE_VWORLD_DOMAIN (개발=localhost, 배포=실제 도메인)
      __vwNet 은 "네트워크에서 받아졌는지"를 남겨 원인 판별(차단 vs 실행실패)에 쓴다.
    -->
    <script>
      window.__vwNet = 'pending';
    </script>
    <script
      type="text/javascript"
      src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=%VITE_VWORLD_KEY%&domain=%VITE_VWORLD_DOMAIN%"
      onload="window.__vwNet='ok'"
      onerror="window.__vwNet='blocked'"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
